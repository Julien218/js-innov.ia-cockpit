<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elynea Companion</title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; overflow: hidden; }
    body { display: grid; place-items: center; font-family: Inter, system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
    .orb {
      position: relative; width: 76px; height: 76px; border-radius: 50%;
      border: 1px solid rgba(212,175,55,.75);
      background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.2), rgba(15,23,42,.96) 55%, rgba(11,11,15,.98));
      box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 22px rgba(212,175,55,.24);
      overflow: hidden; -webkit-app-region: no-drag; cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .orb:hover { transform: scale(1.06); box-shadow: 0 12px 34px rgba(0,0,0,.5), 0 0 28px rgba(34,211,238,.3); }
    .orb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .fallback { position: absolute; inset: 0; display: grid; place-items: center; color: #D4AF37; font-weight: 800; font-size: 26px; z-index: -1; }
    .status { position: absolute; right: 3px; bottom: 5px; width: 12px; height: 12px; border-radius: 50%; background: #22c55e; border: 2px solid #0B0B0F; box-shadow: 0 0 8px rgba(34,197,94,.7); }
    .hint {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      font-size: 9px; color: rgba(255,255,255,.7); background: rgba(11,11,15,.72);
      border: 1px solid rgba(255,255,255,.08); border-radius: 9px; padding: 2px 6px;
      white-space: nowrap; pointer-events: none;
    }
  </style>
</head>
<body>
  <button class="orb" id="elynea" type="button" title="Ouvrir Elynea">
    <span class="fallback">E</span>
    <img src="https://www.jsinnovia.com/brand/companion/companion-avatar-256.webp" alt="Elynea" />
    <span class="status" aria-hidden="true"></span>
  </button>
  <div class="hint">Elynea</div>
  <script>
    document.getElementById('elynea').addEventListener('click', () => {
      window.electronAPI?.desktopCompanion?.openCockpit?.();
    });
  </script>
</body>
</html>
