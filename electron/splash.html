<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#03050A;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    height:100vh; font-family:system-ui,sans-serif;
    color:#F7F9FF; overflow:hidden;
    -webkit-app-region:drag;
  }
  .mark { width:92px; height:92px; margin-bottom:12px; }
  .logo {
    font-size:30px; font-weight:800; letter-spacing:7px;
    background:linear-gradient(90deg,#00D9FF,#1778FF 38%,#754BFF 68%,#F100FF);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .byline { margin-top:5px; margin-bottom:30px; color:#A8B1C5; font-size:13px; letter-spacing:3px; }
  .bar-wrap { width:210px; height:3px; background:#151B2C; border-radius:3px; overflow:hidden; }
  .bar { height:3px; background:linear-gradient(90deg,#00D9FF,#1778FF,#754BFF,#F100FF); animation:load 1.4s ease-in-out forwards; }
  @keyframes load { from{width:0} to{width:100%} }
</style>
</head>
<body>
  <img class="mark" src="icon.png" alt="" />
  <div class="logo">SIGNELYA</div>
  <div class="byline">by JS-Innov.IA</div>
  <div class="bar-wrap"><div class="bar"></div></div>
</body>
</html>
