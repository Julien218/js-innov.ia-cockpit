<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Fond panoramique JS-Innov.IA">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#153861"/>
      <stop offset="0.36" stop-color="#6b86a0"/>
      <stop offset="0.64" stop-color="#e7b071"/>
      <stop offset="1" stop-color="#243b4c"/>
    </linearGradient>
    <radialGradient id="sun" cx="56%" cy="34%" r="34%">
      <stop offset="0" stop-color="#fff7c7" stop-opacity=".98"/>
      <stop offset=".18" stop-color="#ffd76a" stop-opacity=".78"/>
      <stop offset=".46" stop-color="#f5a94b" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f5a94b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeA" x1="0" x2="1" y1="0" y2="1">
