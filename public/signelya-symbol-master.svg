<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SIGNELYA — symbole master</title>
  <desc id="desc">S-ruban cyan bleu violet magenta devant un cadre écran, avec pixels numériques sur la gauche.</desc>
  <defs>
    <linearGradient id="brand" x1="0%" y1="10%" x2="100%" y2="90%">
      <stop offset="0%" stop-color="#00D9FF"/>
      <stop offset="38%" stop-color="#1778FF"/>
      <stop offset="68%" stop-color="#754BFF"/>
      <stop offset="100%" stop-color="#F100FF"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8BEAFF"/>
      <stop offset="55%" stop-color="#1778FF"/>
      <stop offset="100%" stop-color="#754BFF"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="24" y="24" width="976" height="976" rx="224" fill="#03050A"/>

  <g opacity="0.95">
    <rect x="244" y="212" width="620" height="550" rx="44" fill="#090D16" stroke="url(#frame)" stroke-width="16"/>
    <rect x="276" y="244" width="556" height="486" rx="26" fill="none" stroke="#1778FF" stroke-opacity="0.35" stroke-width="4"/>
  </g>

  <g filter="url(#softGlow)">
    <rect x="118" y="344" width="48" height="48" rx="8" fill="#1778FF"/>
    <rect x="172" y="284" width="70" height="70" rx="10" fill="#00D9FF"/>
    <rect x="138" y="458" width="60" height="60" rx="10" fill="#754BFF"/>
    <rect x="206" y="400" width="86" height="86" rx="12" fill="#00D9FF"/>
    <rect x="216" y="534" width="52" height="52" rx="8" fill="#F100FF"/>
  </g>

  <path d="M760 264
           C674 203 522 197 435 251
           C353 302 350 397 430 443
           C474 469 534 479 590 500
           C673 531 688 609 629 660
           C572 709 473 703 386 744"
        fill="none"
        stroke="url(#brand)"
        stroke-width="118"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#softGlow)"/>

  <path d="M760 264
           C674 203 522 197 435 251
           C353 302 350 397 430 443
           C474 469 534 479 590 500
           C673 531 688 609 629 660
           C572 709 473 703 386 744"
        fill="none"
        stroke="#F7F9FF"
        stroke-opacity="0.18"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
