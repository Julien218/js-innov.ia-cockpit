plugins { id 'com.android.application' }

android {
    namespace 'ia.jsinnov.pixeliumplayer'
    compileSdk 35

    defaultConfig {
        applicationId 'ia.jsinnov.pixeliumplayer'
        minSdk 23
        targetSdk 28
        versionCode 4
        versionName '0.5.0-pilot'
    }

    lint {
        // Private sideloaded TVBOX player: keep Android 9 compatibility behavior for the pilot.
        // This APK is not being submitted to Google Play, so the Play target-SDK expiry check is not applicable here.
        disable 'ExpiredTargetSdkVersion'
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('PIXELIUM_KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('PIXELIUM_KEYSTORE_PASSWORD')
                keyAlias System.getenv('PIXELIUM_KEY_ALIAS') ?: 'pixelium-release'
                keyPassword System.getenv('PIXELIUM_KEY_PASSWORD') ?: System.getenv('PIXELIUM_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}
