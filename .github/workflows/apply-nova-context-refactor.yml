name: Apply NOVA context refactor

on:
  push:
    branches:
      - feat/nova-single-source-doctrine

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nova-single-source-doctrine
      - name: Apply targeted refactor
        run: |
          python scripts/refactor-nova-context.py
          node --check server-assistant.cjs
      - name: Commit result
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-assistant.cjs
          git commit -m "refactor(nova): keep Cockpit identity context factual"
          git push origin HEAD:feat/nova-single-source-doctrine
