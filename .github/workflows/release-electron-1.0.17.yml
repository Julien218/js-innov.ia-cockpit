name: Release Electron 1.0.17

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-electron-1.0.17.yml"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify version
        shell: pwsh
        run: |
          node -e "const p=require('./package.json'); if(p.version!=='1.0.17') { console.error('Expected 1.0.17, got '+p.version); process.exit(1) }"
          node --check main.js
          node --check preload.js

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSInnovIA-Cockpit-1.0.17-Windows
          path: electron/dist/*.exe
          retention-days: 90

      - name: Publish v1.0.17
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.17
          target_commitish: main
          name: "JS-Innov.IA Cockpit v1.0.17 — Local Video Orchestrator"
          body: |
            ## JS-Innov.IA Cockpit v1.0.17

            ### Vidéo locale
            - Agent Vidéo Orchestrator dans le Studio
            - Bascule LOCAL / API, LOCAL par défaut
            - Bridge Electron sécurisé vers ComfyUI sur 127.0.0.1:8188
            - MiniMax H3 T2V / I2V via workflow ComfyUI API Format
            - Upload local de première image, queue, suivi et interruption des jobs
            - Détection ComfyUI et FFmpeg
            - Optimisation de montage locale basée sur BPM et transitions
            - Génération de prompt locale sans appel LLM externe
            - Exports Canvas/MediaRecorder existants conservés

            Le workflow H3 doit être importé une seule fois au format API dans le Studio pour associer le template ComfyUI local.
          files: electron/dist/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
