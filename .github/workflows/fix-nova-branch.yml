name: Repair NOVA doctrine branch

on:
  push:
    branches:
      - feat/nova-single-source-doctrine

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nova-single-source-doctrine
      - name: Repair targeted syntax regression only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server-assistant-batch.cjs')
          s = p.read_text()
          bad = ".filter((log) => /update_project/i.test(String(log.action || ''))\n"
          good = ".filter((log) => /update_project/i.test(String(log.action || '')))\n"
          if bad not in s:
              raise SystemExit('Target syntax regression not found; refusing broad edit')
          p.write_text(s.replace(bad, good, 1))
          PY
          node --check server-assistant-batch.cjs
      - name: Commit repair
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server-assistant-batch.cjs
          git commit -m "fix(nova): repair batch syntax after context refactor"
          git push origin HEAD:feat/nova-single-source-doctrine
