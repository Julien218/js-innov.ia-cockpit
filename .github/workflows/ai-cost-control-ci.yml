name: AI Cost Control CI

on:
  pull_request:
    paths:
      - 'server-ai-cost-attribution.cjs'
      - 'server-ai-cost-ledger-aggregate.cjs'
      - 'server-cost-accounting-core.cjs'
      - 'server-cost-centers.cjs'
      - 'server-nova-routing.cjs'
      - 'vite.config.js'
      - 'scripts/public-env.mjs'
      - 'tests/cost-attribution-isolation.test.cjs'
      - 'tests/cost-ledger-isolation-http.test.cjs'
      - 'server-ai-cost.cjs'
      - 'server-client-costs.cjs'
      - 'server-openai-cost-diagnostic.cjs'
      - 'src/components/OpenAICostConnectionTest.jsx'
      - 'tests/openai-cost-diagnostic.test.cjs'
      - 'server-assistant.cjs'
      - 'server.cjs'
      - 'src/pages/AICostControl.jsx'
      - 'src/pages/LocalVideoFactory.jsx'
      - 'src/lib/localTelemetry.js'
      - 'local-agent/**'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/ai-cost-control.test.cjs'
      - 'tests/local-cost-telemetry.test.cjs'
      - 'supabase/migrations/002_ai_cost_control.sql'
      - '.github/workflows/ai-cost-control-ci.yml'
  push:
    branches:
      - 'feat/ai-cost-control'
    paths:
      - 'server-ai-cost.cjs'
      - 'server-client-costs.cjs'
      - 'server-openai-cost-diagnostic.cjs'
      - 'src/components/OpenAICostConnectionTest.jsx'
      - 'tests/openai-cost-diagnostic.test.cjs'
      - 'server-assistant.cjs'
      - 'server.cjs'
      - 'src/pages/AICostControl.jsx'
      - 'src/pages/LocalVideoFactory.jsx'
      - 'src/lib/localTelemetry.js'
      - 'local-agent/**'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/ai-cost-control.test.cjs'
      - 'tests/local-cost-telemetry.test.cjs'
      - 'supabase/migrations/002_ai_cost_control.sql'
      - '.github/workflows/ai-cost-control-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: AI Cost Control typecheck
        run: >-
          npx tsc --allowJs --checkJs --noEmit --jsx react-jsx
          --module ESNext --moduleResolution bundler --target ES2022
          --esModuleInterop --skipLibCheck src/pages/AICostControl.jsx

      - name: Repository typecheck (legacy visibility)
        continue-on-error: true
        run: npm run typecheck

      - name: Production build
        run: npm run build
