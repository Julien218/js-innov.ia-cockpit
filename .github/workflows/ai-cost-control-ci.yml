name: AI Cost Control CI

on:
  pull_request:
    paths:
      - 'server-ai-cost.cjs'
      - 'server-provider-billing.cjs'
      - 'server-assistant.cjs'
      - 'server.cjs'
      - 'src/pages/AICostControl.jsx'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/ai-cost-control.test.cjs'
      - 'tests/provider-billing.test.cjs'
      - 'supabase/migrations/002_ai_cost_control.sql'
      - '.github/workflows/ai-cost-control-ci.yml'
  push:
    branches:
      - 'feat/ai-cost-control'
      - 'feat/provider-billing-openai-xai'
    paths:
      - 'server-ai-cost.cjs'
      - 'server-provider-billing.cjs'
      - 'server-assistant.cjs'
      - 'server.cjs'
      - 'src/pages/AICostControl.jsx'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/ai-cost-control.test.cjs'
      - 'tests/provider-billing.test.cjs'
      - 'supabase/migrations/002_ai_cost_control.sql'
      - '.github/workflows/ai-cost-control-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Server syntax
        run: node --check server-ai-cost.cjs && node --check server-provider-billing.cjs

      - name: Lint
        run: npm run lint

      - name: AI Cost Control typecheck
        run: >-
          npx tsc --allowJs --checkJs --noEmit --jsx react-jsx
          --module ESNext --moduleResolution bundler --target ES2022
          --esModuleInterop --skipLibCheck src/pages/AICostControl.jsx

      - name: Repository typecheck (legacy visibility)
        continue-on-error: true
        run: npm run typecheck

      - name: Production build
        run: npm run build
