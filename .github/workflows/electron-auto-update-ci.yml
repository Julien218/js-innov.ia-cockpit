name: Electron Auto Update CI

on:
  pull_request:
    paths:
      - "electron/**"
      - "elynea-qml/**"
      - "local-agent/**"
      - "src/components/FloatingAgent.jsx"
      - "src/lib/mediaReference.js"
      - "tests/local-agent-tools.test.cjs"
      - "tests/local-cost-telemetry.test.cjs"
      - "tests/electron-global-auto-update.test.cjs"
      - ".github/workflows/electron-auto-update-ci.yml"
      - ".github/workflows/electron-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-windows-desktop:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Elynea QML companion
        working-directory: elynea-qml
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest tests/test_contract.py
          pyside6-qmllint qml/Main.qml
          pyinstaller --noconfirm --clean --windowed --name ElyneaDesktop --icon ..\electron\icon.ico --add-data "qml;qml" --add-data "resources;resources" --add-data "..\local-agent;local-agent" --hidden-import PySide6.QtTextToSpeech --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 main.py

      - name: Build offline Cockpit interface
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Source checks
        shell: pwsh
        run: |
          node --check electron/bootstrap.js
          node --check electron/main.js
          node --check electron/preload.js
          node --test tests/electron-global-auto-update.test.cjs

      - name: Install desktop dependencies
        working-directory: electron
        run: npm install

      - name: Build Windows installer
        working-directory: electron
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater payload
        shell: pwsh
        run: |
          if (-not (Test-Path "electron/dist/latest.yml")) { throw "latest.yml manquant" }
          if (-not (Get-ChildItem "electron/dist/*.exe" -ErrorAction SilentlyContinue)) { throw "installeur .exe manquant" }
          if (-not (Get-ChildItem "electron/dist/*.blockmap" -ErrorAction SilentlyContinue)) { throw "blockmap manquant" }
          if (-not (Test-Path "electron/dist/win-unpacked/resources/offline-web/index.html")) { throw "Interface Cockpit hors ligne manquante" }
          if (-not (Test-Path "electron/dist/win-unpacked/resources/elynea-desktop/ElyneaDesktop.exe")) { throw "Companion Elynea QML manquant" }

      - name: Upload validated Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JSInnovIA-Cockpit-Windows-Validated
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
          retention-days: 90
          if-no-files-found: error
