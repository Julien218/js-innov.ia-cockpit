name: Companion dual-audience CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server-assistant.cjs'
      - 'server-assistant-intent.cjs'
      - 'server-nova-email-triage.cjs'
      - 'src/lib/novaMailboxContext.js'
      - 'src/pages/Emails.jsx'
      - 'tests/nova-email-intent.test.cjs'
      - 'server-assistant-batch.cjs'
      - 'server-base44-agents.cjs'
      - 'server-specialist-tasks.cjs'
      - 'server-nova-document-delete.cjs'
      - 'server-documents.cjs'
      - 'tests/nova-document-delete.test.cjs'
      - 'src/pages/AgentsIA.jsx'
      - 'src/pages/Documents.jsx'
      - 'tests/specialist-tasks.test.cjs'
      - 'server-task-batch.cjs'
      - 'server-nova-executors.cjs'
      - 'server-domain-ops.cjs'
      - 'server-task-autopilot.cjs'
      - 'server-companion-audience.cjs'
      - 'server-companion-memory.cjs'
      - 'server-data-proxy.cjs'
      - 'server-dropbox-helper.cjs'
      - 'server-video-provenance-core.cjs'
      - 'server-video-provenance.cjs'
      - 'server-tenant.cjs'
      - 'server-ai-cost-attribution.cjs'
      - 'server-client-costs.cjs'
      - 'server-cost-centers.cjs'
      - 'server.cjs'
      - 'Dockerfile'
      - 'src/main.jsx'
      - 'src/App.jsx'
      - 'src/lib/roles.js'
      - 'src/lib/assistantConfirmationBridge.js'
      - 'src/lib/mediaReference.js'
      - 'src/lib/novaChatTransport.js'
      - 'src/components/ClientCompanion.jsx'
      - 'src/components/RoleAwareFloatingAgent.jsx'
      - 'src/components/FloatingAgent.jsx'
      - 'local-agent/**'
      - 'src/pages/Agent.jsx'
      - 'src/pages/ClientDashboard.jsx'
      - 'src/pages/ClientRecords.jsx'
      - 'tests/companion-contract.test.cjs'
      - 'tests/companion-task-batch.test.cjs'
      - 'tests/nova-real-executors.test.cjs'
      - 'tests/task-autopilot.test.cjs'
      - 'tests/local-agent-tools.test.cjs'
      - 'tests/nova-media-dropbox.test.cjs'
      - 'tests/video-provenance.test.cjs'
      - 'tests/client-billing-integrity.test.cjs'
      - 'tests/hainoflow-tenant.test.cjs'
      - 'tests/billing-archive.test.cjs'
      - 'supabase/migrations/20260818122500_client_assistant_profiles.sql'
      - 'supabase/migrations/20260819165000_client_billing_integrity_and_cost_ledger.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/companion-ci.yml'
  push:
    branches:
      - main
      - feat/companion-dual-audience
      - fix/companion-confirm-client-billing-integrity
      - fix/companion-orchestration-autonomy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python for full regression suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio analysis and render test prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'librosa==0.11.0' 'soundfile>=0.12,<1' 'pypdf>=5,<7'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check server.cjs
          node --check server-assistant.cjs
          node --check server-assistant-intent.cjs
          node --check server-nova-email-triage.cjs
          node --check server-assistant-batch.cjs
          node --check server-base44-agents.cjs
          node --check server-specialist-tasks.cjs
          node --check server-nova-document-delete.cjs
          node --check server-task-batch.cjs
          node --check server-nova-executors.cjs
          node --check server-task-autopilot.cjs
          node --check server-companion-audience.cjs
          node --check server-companion-memory.cjs
          node --check server-data-proxy.cjs
          node --check server-tenant.cjs
          node --check server-ai-cost-attribution.cjs
          node --check server-client-costs.cjs
          node --check server-video-provenance-core.cjs
          node --check server-video-provenance.cjs
          node --check local-agent/server.js
      - name: Full Cockpit regression suite
        run: npm test
      - name: Companion contract tests
        run: node --require ./tests/node-test-globals.cjs --test tests/companion-contract.test.cjs tests/companion-task-batch.test.cjs tests/nova-real-executors.test.cjs tests/task-autopilot.test.cjs tests/client-billing-integrity.test.cjs tests/local-agent-tools.test.cjs
      - name: Build web application
        run: npm run build
      - name: Verify client confidentiality and billing guards
        run: |
          grep -q "audience.mode !== 'client'" server-assistant.cjs
          grep -q "user?.role !== 'superadmin'" server-companion-memory.cjs
          grep -q "create_client_request" server-assistant.cjs
          grep -q "CLIENT_VISIBLE_FIELDS" server-data-proxy.cjs
          grep -q "RoleAwareFloatingAgent" src/App.jsx
          grep -q "ClientDashboard" src/App.jsx
          grep -q "return 'jsinnovia'" server-tenant.cjs
          grep -q "AFFIRMATIVE" src/lib/assistantConfirmationBridge.js
          grep -q "client_key: String(client.id)" server-ai-cost-attribution.cjs
          grep -q "client_cost_events" server-client-costs.cjs
