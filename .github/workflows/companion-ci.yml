name: Companion dual-audience CI

on:
  pull_request:
    paths:
      - 'server-assistant.cjs'
      - 'server-assistant-batch.cjs'
      - 'server-task-batch.cjs'
      - 'server-companion-audience.cjs'
      - 'server-companion-memory.cjs'
      - 'server-data-proxy.cjs'
      - 'server-dropbox-helper.cjs'
      - 'server-tenant.cjs'
      - 'server-ai-cost-attribution.cjs'
      - 'server-client-costs.cjs'
      - 'server-cost-centers.cjs'
      - 'server.cjs'
      - 'Dockerfile'
      - 'src/main.jsx'
      - 'src/App.jsx'
      - 'src/lib/roles.js'
      - 'src/lib/assistantConfirmationBridge.js'
      - 'src/components/ClientCompanion.jsx'
      - 'src/components/RoleAwareFloatingAgent.jsx'
      - 'src/pages/Agent.jsx'
      - 'src/pages/ClientDashboard.jsx'
      - 'src/pages/ClientRecords.jsx'
      - 'tests/companion-contract.test.cjs'
      - 'tests/companion-task-batch.test.cjs'
      - 'tests/client-billing-integrity.test.cjs'
      - 'tests/hainoflow-tenant.test.cjs'
      - 'tests/billing-archive.test.cjs'
      - 'supabase/migrations/20260818122500_client_assistant_profiles.sql'
      - 'supabase/migrations/20260819165000_client_billing_integrity_and_cost_ledger.sql'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/companion-ci.yml'
  push:
    branches:
      - main
      - feat/companion-dual-audience
      - fix/companion-confirm-client-billing-integrity
      - fix/companion-orchestration-autonomy

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Check server syntax
        run: |
          node --check server.cjs
          node --check server-assistant.cjs
          node --check server-assistant-batch.cjs
          node --check server-task-batch.cjs
          node --check server-companion-audience.cjs
          node --check server-companion-memory.cjs
          node --check server-data-proxy.cjs
          node --check server-tenant.cjs
          node --check server-ai-cost-attribution.cjs
          node --check server-client-costs.cjs
      - name: Full Cockpit regression suite
        run: npm test
      - name: Companion contract tests
        run: node --require ./tests/node-test-globals.cjs --test tests/companion-contract.test.cjs tests/companion-task-batch.test.cjs tests/client-billing-integrity.test.cjs
      - name: Build web application
        run: npm run build
      - name: Verify client confidentiality and billing guards
        run: |
          grep -q "audience.mode !== 'client'" server-assistant.cjs
          grep -q "user?.role !== 'superadmin'" server-companion-memory.cjs
          grep -q "create_client_request" server-assistant.cjs
          grep -q "CLIENT_VISIBLE_FIELDS" server-data-proxy.cjs
          grep -q "RoleAwareFloatingAgent" src/App.jsx
          grep -q "ClientDashboard" src/App.jsx
          grep -q "return 'jsinnovia'" server-tenant.cjs
          grep -q "AFFIRMATIVE" src/lib/assistantConfirmationBridge.js
          grep -q "client_key: String(client.id)" server-ai-cost-attribution.cjs
          grep -q "client_cost_events" server-client-costs.cjs
