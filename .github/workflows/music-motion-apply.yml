name: Music Motion - verify source delivery
on:
  push:
    branches: [feat/elynea-music-motion-production-20260911]
    paths: ['.music-motion-delivery/**', '.github/workflows/music-motion-apply.yml']
permissions:
  contents: write
concurrency:
  group: music-motion-verified-source-delivery
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.repository == 'Julien218/js-innov.ia-cockpit' && github.ref == 'refs/heads/feat/elynea-music-motion-production-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/elynea-music-motion-production-20260911
          fetch-depth: 0
          persist-credentials: true
      - name: Verify and apply the reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p music-motion-proof
          python3 - <<'PY'
          import pathlib, json, base64, lzma, hashlib, subprocess
          folder=pathlib.Path('.music-motion-delivery')
          meta=json.loads((folder/'manifest.json').read_text())
          expected='94142ee5c24622148789f5a435884b10973df4515752223a9dcccacbcf215538'
          assert meta['sha256']==expected
          chunks=sorted(folder.glob('*.b64'))
          assert [p.name for p in chunks]==[f'{i:02d}.b64' for i in range(8)]
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text().strip() for p in chunks),validate=True))
          assert len(patch)==218635 and hashlib.sha256(patch).hexdigest()==expected
          files=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','-'],input=patch).decode().splitlines()]
          assert sorted(files)==sorted(meta['files']) and len(files)==21
          assert all(not f.startswith(('.github/', '.env', '/')) and '..' not in pathlib.PurePosixPath(f).parts for f in files)
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          correction=(folder/'corrections.patch').read_bytes()
          assert hashlib.sha256(correction).hexdigest()=='5dde597a4a2f1833a9b9379aeaf5f5b27c8a6393606ebac53060816d9cd84cd6'
          fixes=[line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat','-'],input=correction).decode().splitlines()]
          assert sorted(fixes)==sorted(['src/pages/MusicMotionStudio.jsx','tests/video-studio-audio.test.cjs','tests/music_motion_analysis_test.py','local-agent/requirements-music-motion.txt'])
          subprocess.run(['git','apply','--check','-'],input=correction,check=True)
          subprocess.run(['git','apply','-'],input=correction,check=True)
          pathlib.Path('music-motion-proof/source-verification.json').write_text(json.dumps({'sha256':expected,'files':files,'base_commit':meta['base_commit']},indent=2))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'librosa==0.11.0' 'soundfile>=0.12,<1' 'pypdf>=5,<7'
          npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Compile the complete cockpit
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee music-motion-proof/build.log
      - name: Run behavioral and real-render regressions
        env:
          MUSIC_MOTION_TEST_ARTIFACT_DIR: ${{ github.workspace }}/music-motion-proof
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/music-motion-production.test.cjs tests/music-motion-cloud.test.cjs tests/music-motion-render.test.cjs tests/video-studio-audio.test.cjs 2>&1 | tee music-motion-proof/node-tests.log
          python tests/music_motion_analysis_test.py 2>&1 | tee music-motion-proof/analysis-tests.log
          python tests/whisper_fallback_test.py 2>&1 | tee music-motion-proof/whisper-tests.log
      - name: Commit verified source to feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/elynea-music-motion-production-20260911
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import json, pathlib, subprocess
          files=json.loads(pathlib.Path('.music-motion-delivery/manifest.json').read_text())['files']+['tests/video-studio-audio.test.cjs']
          subprocess.run(['git','add','--',*files],check=True)
          subprocess.run(['git','rm','-r','--','.music-motion-delivery'],check=True)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(music-motion): implement complete-audio production workspace with verified imports and rendering'
          git push origin HEAD:refs/heads/feat/elynea-music-motion-production-20260911
          git rev-parse HEAD > music-motion-proof/verified-source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: music-motion-validation-${{ github.run_id }}
          path: music-motion-proof/
          retention-days: 7
          if-no-files-found: warn
