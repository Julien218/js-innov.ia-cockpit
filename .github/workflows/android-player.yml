name: Android Player APK
on:
  workflow_dispatch:
  push:
    branches: [feature/olivier-signage-surveillance]
    paths: ['player-android/**', '.github/workflows/android-player.yml']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}
      - run: gradle -p player-android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Pixelium-Player-pilot
          path: player-android/app/build/outputs/apk/debug/app-debug.apk

