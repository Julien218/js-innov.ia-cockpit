name: NPM security safe-fix temp
on:
  push:
    branches: [audit/npm-security-20260908]
    paths: ['.github/workflows/npm-security-audit-temp.yml']
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/npm-security-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply only non-breaking audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Reinstall exact fixed lockfile
        run: npm ci --ignore-scripts
      - name: Verify production audit has no high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report
        run: npm audit --json || true
      - name: Run full test suite
        run: npm test
      - name: Build application
        run: npm run build
      - name: Commit only safe lockfile update
        run: |
          git config user.name 'JS-Innov.IA Automation'
          git config user.email 'info@jsinnovia.store'
          git rm .github/workflows/npm-security-audit-temp.yml
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: appliquer les correctifs npm compatibles'
          git push origin audit/npm-security-20260908
