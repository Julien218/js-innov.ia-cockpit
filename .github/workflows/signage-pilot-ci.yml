name: Signage pilot CI

on:
  pull_request:
    paths:
      - 'server.cjs'
      - 'server-signage*.cjs'
      - 'server-postgres.cjs'
      - 'server-player-apk.cjs'
      - 'Dockerfile'
      - 'server-commerce.cjs'
      - 'server-client-onboarding.cjs'
      - 'migrations/**'
      - 'src/pages/DigitalSignage*.jsx'
      - 'src/components/signage/**'
      - 'src/pages/VideoSurveillance.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'tests/signage*.test.cjs'
      - 'player-android/**'
      - 'camera-gateway/**'
      - '.github/workflows/signage-pilot-ci.yml'
  push:
    branches:
      - 'feature/olivier-signage-surveillance'
      - 'feature/olivier-signage-pilot-release'
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'server.cjs'
      - '.github/workflows/signage-pilot-ci.yml'
      - 'server-signage*.cjs'
      - 'server-postgres.cjs'
      - 'server-player-apk.cjs'
      - 'Dockerfile'
      - 'server-commerce.cjs'
      - 'server-client-onboarding.cjs'
      - 'server-agents.cjs'
      - 'migrations/**'
      - 'src/pages/DigitalSignage*.jsx'
      - 'src/components/signage/**'
      - 'src/pages/VideoSurveillance.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'tests/signage*.test.cjs'
      - 'player-android/**'
      - 'camera-gateway/**'
  workflow_dispatch:

concurrency:
  group: signage-pilot-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --legacy-peer-deps
      - run: node --check server.cjs
      - run: node --check server-signage.cjs
      - run: node --check server-signage-runtime.cjs
      - run: node --check server-signage-display.cjs
      - run: node --check server-signage-schedule.cjs
      - run: node --check server-signage-schedule-router.cjs
      - run: node --check server-signage-schedule-compat.cjs
      - run: node --check server-commerce.cjs
      - run: node --check server-client-onboarding.cjs
      - run: node --check server-postgres.cjs
      - run: node --check server-player-apk.cjs
      - run: node --check camera-gateway/gateway.mjs
      - run: npm test
      - run: NODE_OPTIONS=--max-old-space-size=4096 npm run build

  verify-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Assert resilient runtime contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "versionName '0.6.1-pilot'" player-android/app/build.gradle
          grep -q 'foregroundServiceType="specialUse"' player-android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_SPECIAL_USE' player-android/app/src/main/AndroidManifest.xml
          grep -q '/api/signage/player/runtime-heartbeat' player-android/app/src/main/java/ia/jsinnov/pixeliumplayer/PixeliumGuardianService.java
          grep -q 'PlayerRuntimeState.markPlaybackHeartbeat' player-android/app/src/main/java/ia/jsinnov/pixeliumplayer/ScheduledMainActivity.java
      - run: gradle -p player-android :app:assembleDebug --no-daemon
      - name: Inspect debug APK
        shell: bash
        run: |
          set -euo pipefail
          APK="player-android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | tee player-badging.txt
          grep -q "versionName='0.6.1-pilot'" player-badging.txt
      - name: Upload Player debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pixelium-player-0.6.1-pilot-debug
          path: |
            player-android/app/build/outputs/apk/debug/app-debug.apk
            player-badging.txt
          retention-days: 14
          if-no-files-found: error

# La publication signée est volontairement centralisée dans
# pixelium-release-recovery.yml afin d'éviter deux pipelines concurrents.
