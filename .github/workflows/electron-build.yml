name: Build Electron .exe Windows

on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "electron/**"
      - ".github/workflows/electron-build.yml"
      - "tests/electron-auto-update.test.cjs"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build Windows .exe
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSInnovIA-Cockpit-Setup-Windows
          path: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/*.exe
            electron/dist/latest.yml
            electron/dist/*.blockmap
          name: "🚀 JS-Innov.IA Cockpit ${{ github.ref_name }}"
          body: |
            ## JS-Innov.IA Cockpit ${{ github.ref_name }}
            
            ### Téléchargement
            Téléchargez et lancez le fichier `.exe` — installation silencieuse, raccourci bureau créé automatiquement.
            
            ### Mise à jour
            Après l'installation de cette version, les suivantes seront téléchargées automatiquement à l'ouverture.
            Elles seront installées sans nouveau téléchargement manuel lorsque vous fermerez le cockpit.
            
            ### Inclus
            - Cockpit complet (clients, devis, factures, tâches, projets)
            - Boîte email avec pièces jointes (transfert + impression corrigés)
            - Module Twilio (SMS, appels)
            - Tray icon + Notifications Windows
            - Splash screen
            - Vérification automatique des mises à jour
            - Fix crash Electron (TypeError: Object has been destroyed)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
