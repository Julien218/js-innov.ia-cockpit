name: Build & Release Electron Windows

concurrency:
  group: electron-release-main
  cancel-in-progress: false

on:
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "elynea-qml/**"
      - "local-agent/**"
      - "src/components/FloatingAgent.jsx"
      - "src/components/RoleAwareFloatingAgent.jsx"
      - "src/components/LocalAgentQueueBridge.jsx"
      - "src/lib/localAgentQueueBridge.js"
      - "src/lib/mediaReference.js"
      - "src/lib/videoProvenance.js"
      - "server-video-provenance-core.cjs"
      - "tests/electron-global-auto-update.test.cjs"
      - "tests/electron-local-agent-watchdog.test.cjs"
      - "tests/local-cost-telemetry.test.cjs"
      - ".github/workflows/electron-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Elynea QML companion
        working-directory: elynea-qml
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest tests/test_contract.py
          pyside6-qmllint qml/Main.qml
          pyinstaller --noconfirm --clean --windowed --name ElyneaDesktop --icon ..\electron\icon.ico --add-data "qml;qml" --add-data "resources;resources" --add-data "..\local-agent;local-agent" --hidden-import PySide6.QtTextToSpeech --hidden-import PySide6.QtQuick --hidden-import PySide6.QtQuickControls2 main.py
          if (-not (Test-Path "dist\ElyneaDesktop\ElyneaDesktop.exe")) { throw "ElyneaDesktop.exe manquant" }

      - name: Build offline Cockpit interface
        working-directory: .
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Calculate next Electron version
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $latestTag = git tag --list "v*" --sort=-v:refname | Select-Object -First 1
          if ($latestTag) {
            $baseVersion = $latestTag.TrimStart("v")
          } else {
            $baseVersion = node -p "require('./package.json').version"
          }
          if ($baseVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version Electron invalide: $baseVersion"
          }
          $parts = $baseVersion.Split(".")
          $version = "{0}.{1}.{2}" -f $parts[0], $parts[1], ([int]$parts[2] + 1)
          npm version $version --no-git-tag-version --allow-same-version
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building JS-Innov.IA Cockpit v$version from latest release $latestTag"

      - name: Validate desktop sources
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check preload.js
          node -e "const p=require('./package.json'); if(p.main!=='bootstrap.js') process.exit(1); if(!p.dependencies?.['electron-updater']) process.exit(1);"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) { throw "dist/latest.yml manquant : auto-update impossible" }
          $exe = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installeur .exe manquant" }
          if (-not (Test-Path "dist/win-unpacked/resources/offline-web/index.html")) { throw "Interface Cockpit hors ligne manquante" }
          if (-not (Test-Path "dist/win-unpacked/resources/video-provenance-core.cjs")) { throw "Finaliseur vidéo local manquant" }
          if (-not (Test-Path "dist/win-unpacked/resources/elynea-desktop/ElyneaDesktop.exe")) { throw "Companion Elynea QML manquant" }
          Write-Host "Installer: $($exe.Name)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: JSInnovIA-Cockpit-${{ steps.version.outputs.version }}-Windows
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "JS-Innov.IA Cockpit v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
