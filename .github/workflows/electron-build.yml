name: Build & Release Electron Windows

on:
  push:
    branches:
      - main
    paths:
      - "electron/**"
      - "local-agent/**"
      - "src/components/FloatingAgent.jsx"
      - "src/lib/mediaReference.js"
      - "src/lib/videoProvenance.js"
      - "server-video-provenance-core.cjs"
      - ".github/workflows/electron-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build offline Cockpit interface
        working-directory: .
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund
          npm run build

      - name: Read Electron version
        id: version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if (-not $version) { throw "Version Electron introuvable" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building JS-Innov.IA Cockpit v$version"

      - name: Validate desktop sources
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check preload.js
          node -e "const p=require('./package.json'); if(p.main!=='bootstrap.js') process.exit(1); if(!p.dependencies?.['electron-updater']) process.exit(1);"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify updater metadata
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml")) { throw "dist/latest.yml manquant : auto-update impossible" }
          $exe = Get-ChildItem "dist/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "Installeur .exe manquant" }
          if (-not (Test-Path "dist/win-unpacked/resources/offline-web/index.html")) { throw "Interface Cockpit hors ligne manquante" }
          if (-not (Test-Path "dist/win-unpacked/resources/video-provenance-core.cjs")) { throw "Finaliseur vidéo local manquant" }
          Write-Host "Installer: $($exe.Name)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: JSInnovIA-Cockpit-${{ steps.version.outputs.version }}-Windows
          path: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
          retention-days: 90
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: "JS-Innov.IA Cockpit v${{ steps.version.outputs.version }}"
          generate_release_notes: true
          files: |
            electron/dist/*.exe
            electron/dist/*.blockmap
            electron/dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
