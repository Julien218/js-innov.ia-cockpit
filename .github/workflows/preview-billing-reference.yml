name: Preview billing reference
on:
  push:
    branches: [fix/billing-template-reference-20260905]
    paths:
      - server-billing-template.cjs
      - .github/workflows/preview-billing-reference.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate reference invoice
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const {generateInvoicePDF}=require('./server-billing-template.cjs');
          const sample={numero:'JSI-2026-00057',date_emission:'2026-07-24',date_echeance:'2026-08-23',periode:'24/07/2026 - 23/07/2027',client_nom:'Olivier Trevis Consulting SRL',client_adresse:'Rue du Commerce 351',client_ville:'7370 Dour, Belgique',client_tva:'BE 0882.718.177',objet:'Gestion domaines & services',mode_paiement:'Virement bancaire',conditions_paiement:'Paiement à 30 jours',montant_ht:114.05,montant_tva:23.95,montant_ttc:138,tva:21,items:[{description:'Forfait annuel de gestion du domaine principal',url:'www.assurances-dour.be',note:'Protection du domaine, configuration DNS, renouvellement, suivi administratif et assistance technique.',periode:'24/07/2026\nau 23/07/2027',unit_price_ht:73.55,tva:21,total_ttc:89},{description:'Forfait annuel de gestion du domaine secondaire',url:'www.assurancedour.be',note:'Protection de marque, redirection éventuelle, configuration DNS, renouvellement et suivi.',periode:'24/07/2026\nau 23/07/2027',unit_price_ht:40.50,tva:21,total_ttc:49}]};
          generateInvoicePDF(sample,'facture').then(b=>{fs.writeFileSync('FACTURE-REFERENCE.pdf',b);console.log(b.length)}).catch(e=>{console.error(e);process.exit(1)});
          NODE
      - run: test -s FACTURE-REFERENCE.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: facture-reference
          path: FACTURE-REFERENCE.pdf
          retention-days: 1
