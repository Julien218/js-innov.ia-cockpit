name: Video Local Orchestrator CI

on:
  pull_request:
    paths:
      - "src/pages/VideoStudio.jsx"
      - "src/pages/DourCampaignVideo.jsx"
      - "src/components/studio/**"
      - "src/lib/videoOrchestrator.js"
      - "src/lib/videoProvenance.js"
      - "server-video-generation-core.cjs"
      - "server-video-generation.cjs"
      - "server-nova-executors.cjs"
      - "server-video-provenance-core.cjs"
      - "server-video-provenance.cjs"
      - "tests/nova-video-autostart.test.cjs"
      - "tests/video-api-generation.test.cjs"
      - "tests/video-provenance.test.cjs"
      - "electron/**"
      - ".github/workflows/video-local-ci.yml"
  push:
    branches:
      - main
    paths:
      - "src/pages/VideoStudio.jsx"
      - "src/pages/DourCampaignVideo.jsx"
      - "src/components/studio/**"
      - "src/lib/videoOrchestrator.js"
      - "src/lib/videoProvenance.js"
      - "server-video-generation-core.cjs"
      - "server-video-generation.cjs"
      - "server-nova-executors.cjs"
      - "server-video-provenance-core.cjs"
      - "server-video-provenance.cjs"
      - "tests/nova-video-autostart.test.cjs"
      - "tests/video-api-generation.test.cjs"
      - "tests/video-provenance.test.cjs"
      - "electron/**"
      - ".github/workflows/video-local-ci.yml"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Build Cockpit
        run: npm run build

      - name: Syntax-check video and NOVA orchestrators
        run: |
          node --check src/lib/videoOrchestrator.js
          node --check src/lib/videoProvenance.js
          node --check server-video-generation-core.cjs
          node --check server-video-generation.cjs
          node --check server-nova-executors.cjs
          node --check server-video-provenance-core.cjs
          node --test tests/electron-comfy-error.test.cjs
          node --check server-video-provenance.cjs

      - name: Verify NOVA video autostart
        run: node --require ./tests/node-test-globals.cjs --test tests/nova-video-autostart.test.cjs

      - name: Verify video API generation
        run: node --require ./tests/node-test-globals.cjs --test tests/video-api-generation.test.cjs

      - name: Verify video provenance policy
        run: node --require ./tests/node-test-globals.cjs --test tests/video-provenance.test.cjs

  electron-check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate Electron sources
        shell: pwsh
        run: |
          node --check bootstrap.js
          node --check main.js
          node --check preload.js
          node -e "const p=require('./package.json'); if(!/^\d+\.\d+\.\d+$/.test(p.version)) process.exit(1); if(p.main!=='bootstrap.js') process.exit(1); console.log('Electron',p.version)"
