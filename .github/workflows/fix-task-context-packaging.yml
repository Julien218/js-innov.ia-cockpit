name: Fix task context packaging

on:
  push:
    branches: [fix/restore-task-context-20260908]
    paths: ['.github/workflows/fix-task-context-packaging.yml']

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-task-context-20260908
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch Dockerfile packaging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Dockerfile')
          s=p.read_text()
          copy_anchor='COPY --from=builder /app/server-task-batch.cjs ./server-task-batch.cjs\n'
          copy_line='COPY --from=builder /app/server-task-context.cjs ./server-task-context.cjs\n'
          if copy_line not in s:
              if copy_anchor not in s: raise SystemExit('COPY anchor missing')
              s=s.replace(copy_anchor, copy_anchor+copy_line, 1)

          test_anchor=' && test -f /app/server-task-batch.cjs \\\n'
          test_line=' && test -f /app/server-task-context.cjs \\\n'
          if test_line not in s:
              if test_anchor not in s: raise SystemExit('test anchor missing')
              s=s.replace(test_anchor, test_anchor+test_line, 1)

          check_anchor=' && node --check /app/server-task-batch.cjs \\\n'
          check_line=' && node --check /app/server-task-context.cjs \\\n'
          if check_line not in s:
              if check_anchor not in s: raise SystemExit('check anchor missing')
              s=s.replace(check_anchor, check_anchor+check_line, 1)

          require_anchor=' && node -e "require(\'/app/server-led-ad-director.cjs\'); require(\'/app/server-agent-registry.cjs\'); require(\'/app/server-nova-routing.cjs\')" \\\n'
          require_next=' && node -e "require(\'/app/server-task-context.cjs\'); require(\'/app/server-assistant-batch.cjs\'); require(\'/app/server-specialist-tasks.cjs\')" \\\n'
          if require_next not in s:
              if require_anchor not in s: raise SystemExit('require anchor missing')
              s=s.replace(require_anchor, require_anchor+require_next, 1)
          p.write_text(s)
          PY
      - run: npm ci --ignore-scripts
      - name: Validate task context and dependent modules
        run: |
          node -c server-task-context.cjs
          node --test tests/task-context-preservation.test.cjs
          node -e "require('./server-task-context.cjs'); require('./server-assistant-batch.cjs'); require('./server-specialist-tasks.cjs'); console.log('Dependent modules load OK')"
      - name: Verify Dockerfile contains runtime guards
        run: |
          grep -F 'COPY --from=builder /app/server-task-context.cjs ./server-task-context.cjs' Dockerfile
          grep -F 'test -f /app/server-task-context.cjs' Dockerfile
          grep -F 'node --check /app/server-task-context.cjs' Dockerfile
      - name: Commit only canonical packaging fix
        run: |
          git config user.name 'JS-Innov.IA Automation'
          git config user.email 'info@jsinnovia.store'
          git rm .github/workflows/fix-task-context-packaging.yml
          git add Dockerfile
          git commit -m 'fix: embarquer server-task-context dans le runtime'
          git push origin fix/restore-task-context-20260908
