name: Campaign Orchestrator CI
# Re-run on Docker/runtime hardening

on:
  push:
    branches:
      - feature/campaign-orchestrator
      - fix/campaign-canonical-brand-registry
      - feature/campaign-generation-engine-v2
    paths:
      - 'src/pages/Campaigns.jsx'
      - 'src/lib/campaignOrchestrator.js'
      - 'server-campaigns*.cjs'
      - 'server-campaign-*.cjs'
      - 'local-agent/campaign-worker.mjs'
      - 'local-agent/server.js'
      - 'electron/package.json'
      - 'server-brand-canonical.cjs'
      - 'brand/**'
      - 'server.cjs'
      - 'Dockerfile'
      - 'permission-catalog.json'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/campaign-orchestrator.test.cjs'
      - 'supabase/migrations/*campaign*.sql'
      - '.github/workflows/campaigns-ci.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Server syntax
        run: |
          node --check server-brand-canonical.cjs
          node --check server-campaign-media.cjs
          node --check server-campaign-engine.cjs
          node --check server-campaign-worker.cjs
          node --check local-agent/campaign-worker.mjs
          node --check local-agent/server.js
          node --check server-campaigns-core.cjs
          node --check server-campaigns.cjs
          node --check server.cjs
      - name: Campaign tests
        run: node --test tests/campaign-orchestrator.test.cjs
      - name: Build
        run: npm run build
