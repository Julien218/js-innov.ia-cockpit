name: Publisya CI

on:
  push:
    branches:
      - 'feature/publisya-*'
    paths:
      - 'server-publisya*.cjs'
      - 'src/pages/Publisya.jsx'
      - 'src/components/publisya/**'
      - 'src/lib/publisyaClient.js'
      - 'src/App.jsx'
      - 'src/lib/roles.js'
      - 'src/components/layout/Sidebar.jsx'
      - 'permission-catalog.json'
      - 'supabase/migrations/*publisya*.sql'
      - 'tests/publisya-module.test.cjs'
      - 'Dockerfile'
      - '.github/workflows/publisya-ci.yml'
  pull_request:
    paths:
      - 'server-publisya*.cjs'
      - 'src/pages/Publisya.jsx'
      - 'src/components/publisya/**'
      - 'src/lib/publisyaClient.js'
      - 'src/App.jsx'
      - 'src/lib/roles.js'
      - 'src/components/layout/Sidebar.jsx'
      - 'permission-catalog.json'
      - 'supabase/migrations/*publisya*.sql'
      - 'tests/publisya-module.test.cjs'
      - 'Dockerfile'
      - '.github/workflows/publisya-ci.yml'

permissions:
  contents: read

concurrency:
  group: publisya-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build & safety contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Cockpit
        run: npm run build

      - name: Check Publisya server syntax
        run: |
          node --check server-publisya.cjs
          node --check server-publisya-ai.cjs
          node --check server-publisya-review.cjs

      - name: Run Publisya safety tests
        run: node --require ./tests/node-test-globals.cjs --test tests/publisya-module.test.cjs

      - name: Assert no external publisher is enabled
        run: |
          ! grep -q "startPublisyaScheduler.*started: true" server-publisya.cjs
          grep -q "publishing_enabled: false" server-publisya.cjs
          grep -q "direct_publish: false" server-publisya.cjs
          grep -q "server-publisya-review.cjs" Dockerfile
