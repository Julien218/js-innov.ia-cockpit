name: Assurances-Dour Follow-up CI

on:
  pull_request:
    paths:
      - 'server-insurance.cjs'
      - 'server-insurance-mailbox.cjs'
      - 'src/pages/Assurances.jsx'
      - 'src/App.jsx'
      - 'src/components/layout/Sidebar.jsx'
      - 'src/lib/roles.js'
      - 'tests/insurance-followup.test.cjs'
      - '.github/workflows/assurances-followup-ci.yml'
      - '.env.example'
  push:
    branches:
      - 'feat/assurances-email-followup'

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Dependency audit — inherited high/moderate debt (visible)
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Dependency audit — block critical vulnerabilities
        run: npm audit --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Repository typecheck — known EmailCore debt remains visible
        continue-on-error: true
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Server syntax
        run: |
          node --check server.cjs
          node --check server-insurance.cjs
          node --check server-insurance-mailbox.cjs
      - name: Insurance access and privacy tests
        run: node --test tests/insurance-followup.test.cjs
      - name: Diff hygiene
        run: git diff --check
