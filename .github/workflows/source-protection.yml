name: Source protection

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-protection:
    name: Source protection / tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-09-25
        with:
          persist-credentials: false
      - name: Test the guard (no dependency installation)
        run: node --test tests/source-protection.test.mjs
      - name: Audit tracked paths (no contents or secret values logged)
        run: node scripts/source-protection-audit.mjs
